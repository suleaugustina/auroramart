version: '3.8'

services:
  # PostgreSQL Data Warehouse
  postgres:
    image: postgres:15-alpine
    container_name: analytics-postgres
    restart: always
    environment:
      POSTGRES_USER: analytics_user
      POSTGRES_PASSWORD: analytics_password
      POSTGRES_DB: analytics_warehouse
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - analytics-net

  # Event Collector (writes directly to PostgreSQL)
  collector:
    build: .
    container_name: analytics-collector
    restart: always
    ports:
      - "5001:5001"
    environment:
      DATABASE_URL: postgresql://analytics_user:analytics_password@postgres:5432/analytics_warehouse
      PORT: 5001
    depends_on:
      - postgres
    networks:
      - analytics-net

  # Metabase Business Intelligence Dashboard
  metabase:
    image: metabase/metabase:latest
    container_name: analytics-metabase
    restart: always
    ports:
      - "3030:3000"
    volumes:
      - metabase-data:/metabase-data
    depends_on:
      - postgres
    networks:
      - analytics-net

volumes:
  pgdata:
  metabase-data:

networks:
  analytics-net:
    driver: bridge
